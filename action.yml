name: 'Publish updated packages'
description: 'Publish npm packages and VS Code extensions when the local version is newer than what is already published.'
branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  npm-packages:
    description: 'Newline-separated package directories to publish to npm.'
    required: false
    default: ''
  vscode-packages:
    description: 'Newline-separated extension directories to publish to VS Marketplace and Open VSX.'
    required: false
    default: ''
  dry-run:
    description: 'Log what would be published without actually publishing.'
    required: false
    default: 'false'
  npm-token:
    description: 'npm auth token. Leave empty to use OIDC trusted publishing with --provenance.'
    required: false
    default: ''
  vsce-token:
    description: 'VS Marketplace (vsce) personal access token.'
    required: false
    default: ''
  ovsx-token:
    description: 'Open VSX (ovsx) personal access token.'
    required: false
    default: ''
  vsce-version:
    description: >-
      Version of the vsce CLI to use. "provided" (default, recommended) runs the
      version installed in the project's devDependencies and fails if none is
      present. Any other value (e.g. "1.2.3" or "latest") is fetched on demand
      via npx at your own risk.
    required: false
    default: 'provided'
  ovsx-version:
    description: >-
      Version of the ovsx CLI to use. "provided" (default, recommended) runs the
      version installed in the project's devDependencies and fails if none is
      present. Any other value (e.g. "1.2.3" or "latest") is fetched on demand
      via npx at your own risk.
    required: false
    default: 'provided'

runs:
  using: 'node20'
  main: 'dist/index.cjs'
